spring.application.name=plataforma-sqa
server.port=8080

# ---------------------------------------------------------------
# Base de datos: H2 en archivo (no hay que instalar nada).
# Los datos quedan en la carpeta ./data y sobreviven reinicios.
# Para MySQL usar el perfil "mysql" (ver application-mysql.properties).
# ---------------------------------------------------------------
spring.datasource.url=jdbc:h2:file:./data/sqa-db
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

# Thymeleaf sin caché para ver cambios de plantillas al recargar
spring.thymeleaf.cache=false

# Carga de evidencias (RS-08)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
sqa.evidencias.directorio=./data/evidencias

# Datos de demostración (proyecto, métricas y técnicas de ejemplo).
# Solo se cargan si la base está vacía. Poner en false para empezar en blanco.
sqa.demo.cargar-datos=true
